<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Images - index02</title>
</head>
<body>

    <!-- Correct relative path and valid HTML dimension attributes -->
    <img src="assets/profile.jpg" alt="My profile photo" width="320" height="500">

    <p>
        <a href="https://github.com/Osama10kh" target="_blank" rel="noopener noreferrer">Visit My GitHub Profile</a>
    </p>

    <p>
        <a href="#contact">Jump to Contact Section</a>
    </p>

    <hr>

    <!-- Added id="contact" so the jump link works properly -->
    <h2 id="contact">Contact Information</h2>

    <p>
        <a href="mailto:osama10kh@gmail.com">Send Me an Email</a>
    </p>

</body>
</html>
