<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - index04</title>
</head>
<body>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required minlength="3"><br><br>


        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>


        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required minlength="8"><br><br>

  
        <label>select your age</label><br>
        <input type="radio" id="age1" name="age2" value="age1" required>
        <label for="age1">18 - 25</label><br>
        <input type="radio" id="age2" name="age2" value="age2">
        <label for="age2">25 - 30</label><br><br>

        <label for="field-of-study">Field of Study:</label><br>
        <select id="field-of-study" name="field_of_study" required>
            <option value="" disabled selected>Select your field</option>
            <option value="engineering">Engineering</option>
            <option value="computer_science">Computer Science / IT</option>
            <option value="business">Business Management</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="bio">Short Bio:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Tell us a little bit about yourself..." required minlength="20"></textarea><br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label><br><br>

        <button type="submit">Submit Registration</button>
    </form>

</body>
</html>
